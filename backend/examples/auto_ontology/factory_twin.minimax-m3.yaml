    bridge_table:
    - id: 59ef3c1e-1b2b-441f-b2e5-96ae1183e580
      name: Schedule Item Resources
      description: Junction/bridge table linking schedule items to the factory resources
        (people, machines, equipment) assigned to them; one row represents one resource
        allocated to one schedule item, and the join resolves both the schedule item
        and the factory resource through the bridge.
      sql: SELECT si.item_id, fr.resource_id FROM public.schedule_item_resource AS
        sir JOIN public.schedule_item AS si ON sir.item_id = si.item_id JOIN public.factory_resource
        AS fr ON sir.resource_id = fr.resource_id
      sql_column_is:
      - 905b31ba-9938-4a10-8355-7a6be60f7983
